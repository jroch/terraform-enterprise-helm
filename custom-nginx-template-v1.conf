# The default server for HTTP
server {
    listen {{ .HTTPPort }} default_server;
    {{- if .IPV6Enabled }}
    listen [::]:{{ .HTTPPort }} default_server;
    {{- end }}

    location /_health_check {
        set $upstream {{ .Atlas.URL }};
        proxy_set_header Host tfe.roch-consulting.be;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $upstream$request_uri;
    }

    location / {
        set $upstream {{ .Atlas.URL }};
        proxy_set_header Host tfe.roch-consulting.be;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $upstream$request_uri;
    }
}

# Handle local requests
server {
    listen {{ .HTTPPort }};
    {{- if .IPV6Enabled }}
    listen [::]:{{ .HTTPPort }};
    server_name 127.0.0.1 localhost ::1;
    {{- else }}
    server_name 127.0.0.1 localhost;
    {{- end }}

    proxy_set_header X-Forwarded-Proto http;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    client_max_body_size 0;

    location ~ /_archivist(/?.*) {
        set $upstream {{ .Archivist.URL }};
        proxy_pass $upstream$1$is_args$args;
    }

    location /_health_check {
        set $upstream {{ .Atlas.URL }};
        proxy_set_header Host tfe.roch-consulting.be;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $upstream$request_uri;
    }

    location ~ /_backup(/?.*) {
        set $upstream {{ .BackupRestore.URL }};
        proxy_pass $upstream$1$is_args$args;
        proxy_read_timeout 5000s;
        proxy_send_timeout 5000s;
    }

    # Route static frontend paths to Ember
    location ~ ^/(app|public|pages|fake-web-services|torii) {
        set $upstream http://127.0.0.1:9080;
        proxy_set_header Host tfe.roch-consulting.be;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $upstream$request_uri;
    }

    location / {
        set $upstream {{ .Atlas.URL }};
        proxy_set_header Host tfe.roch-consulting.be;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $upstream$request_uri;
    }
}

# Ember app UI
server {
    listen 127.0.0.1:9080;
    server_name 127.0.0.1 localhost;

    root /app/frontend/atlas/dist;
    error_page 500 502 503 504 /50x.html;

    location ~* \.(?:css|js|eot|ttf|woff|woff2)$ {
        expires 30d;
        add_header Access-Control-Allow-Origin '{{ .Hostname }}';

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Max-Age '7200';
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 200;
        }
    }

    location / {
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options 'nosniff';
        add_header X-Frame-Options 'SAMEORIGIN';
        add_header X-XSS-Protection '1; mode=block';
        add_header X-Download-Options 'noopen';
        add_header X-Permitted-Cross-Domain-Policies 'none';
        add_header Referrer-Policy 'strict-origin-when-cross-origin';

        try_files $uri /index.html?/$request_uri;
        index index.html /index.html;
    }
}
