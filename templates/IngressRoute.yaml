apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: default

---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: terraform-tcp
  namespace: terraform-enterprise
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`tfe.roch-consulting.be`)
      services:
        - name: terraform-enterprise
          port: 443
  tls:
    passthrough: true