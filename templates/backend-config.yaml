{{- if .Values.ingress.enabled -}}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: terraform-backend-config
  namespace: {{ .Release.Namespace }}
spec:
  healthCheck:
    # port: {{ .Values.service.nodePort.https }}
    port: 443
    requestPath: /_health_check
    type: HTTPS   
{{- end -}}