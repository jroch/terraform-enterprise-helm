apiVersion: v1
kind: Service
metadata:
  name: terraform-enterprise
  namespace: {{ .Release.Namespace }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.service.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # externalTrafficPolicy: Local
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  ports:
    {{- if .Values.service.port.http }}
    - name: http-port
      port: {{ .Values.service.port.http }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort.http }}
      {{- end }}
      targetPort: {{ .Values.tfe.privateHttpPort }}
      appProtocol: {{ .Values.service.appProtocol }}
    {{- end }}  
    {{- if .Values.service.port.https }}
    - name: https-port
      port: {{ .Values.service.port.https }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort.https }}
      {{- end }}
      targetPort: {{ .Values.tfe.privateHttpsPort }}
      appProtocol: {{ .Values.service.appProtocol }}
    {{- end }}
  selector:
    app: terraform-enterprise
