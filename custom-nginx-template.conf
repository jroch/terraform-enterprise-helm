# The default server for http.
server {
        listen 0.0.0.0:{{ .HTTPPort }} default_server;

        {{- if .IPV6Enabled }}
        listen [::]:{{ .HTTPPort }} default_server;
        {{- end }}

        location /_health_check {
                set $upstream {{ .Atlas.URL }};
                proxy_pass $upstream$request_uri;
        }

        location / {
                return 301 https://{{ .Hostname }}$request_uri;
        }
}

# Handle local requests.
server {
        listen {{ .HTTPPort }};

        {{- if .IPV6Enabled }}
        listen [::]:{{ .HTTPPort }};
        server_name 127.0.0.1 localhost ::1;
        {{- else }}
        server_name 127.0.0.1 localhost;
        {{- end }}

        proxy_set_header X-Forwarded-Proto http;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        client_max_body_size 0;

        location ~ /_archivist(/?.*) {
                set $upstream {{ .Archivist.URL }};
                proxy_pass $upstream$1$is_args$args;
        }

        location /_health_check {
                set $upstream {{ .Atlas.URL }};
                proxy_pass $upstream$request_uri;
        }

        location ~ /_backup(/?.*) {
                set $upstream {{ .BackupRestore.URL }};
                proxy_pass $upstream$1$is_args$args;
                proxy_read_timeout 5000s;
                proxy_send_timeout 5000s;
        }

        location / {
                set $upstream {{ .Atlas.URL }};
                proxy_pass $upstream$request_uri;
        }
}

# The default server for port 443.
server {
        listen {{ .HTTPSPort }} ssl default_server;

        {{- if .IPV6Enabled }}
        listen [::]:{{ .HTTPSPort }} ssl default_server;
        {{- end }}

        ssl_certificate {{ .TLS.CertFile }};
        ssl_certificate_key {{ .TLS.KeyFile }};

        location /_health_check {
                set $upstream {{ .Atlas.URL }};
                proxy_pass $upstream$request_uri;
        }

        location / {
                return 301 https://{{ .Hostname }}$request_uri;
        }
}

# Handle requests to the defined hostname.
server {
        listen {{ .HTTPSPort }} ssl;

        {{- if .IPV6Enabled }}
        listen [::]:{{ .HTTPSPort }} ssl;
        {{- end }}

        server_name {{ .Hostname }};

        ssl_certificate {{ .TLS.CertFile }};
        ssl_certificate_key {{ .TLS.KeyFile }};

        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        client_max_body_size 0;

        location ~ /_archivist(/?.*) {
                set $upstream {{ .Archivist.URL }};
                proxy_pass $upstream$1$is_args$args;
        }

        location /_health_check {
                set $upstream {{ .Atlas.URL }};
                proxy_pass $upstream$request_uri;
        }

        location ~ /_health_check_beta(/?.*) {
                set $upstream http://127.0.0.1:23005;
                proxy_pass $upstream$1$is_args$args;
        }

        location ~ ^/(app|public|pages|fake-web-services|torii) {
          set $upstream http://127.0.0.1:9080;
          proxy_pass $upstream$request_uri;
        }

        location / {
                set $upstream {{ .Atlas.URL }};
                proxy_pass $upstream$request_uri;
        }

        location ~ /_backup(/?.*) {
                set $upstream {{ .BackupRestore.URL }};
                proxy_pass $upstream$1$is_args$args;
                proxy_read_timeout 5000s;
                proxy_send_timeout 5000s;
        }

        # Include the support bundle download configuration if enabled.
        include /run/terraform-enterprise/nginx/hcdiag/*;
}

{{- if .SecondaryHostname }}
server {
        listen {{ .HTTPSPort }} ssl;

        {{- if .IPV6Enabled }}
        listen [::]:{{ .HTTPSPort }} ssl;
        {{- end }}

        server_name {{ .SecondaryHostname }};

        ssl_certificate {{ .SecondaryTLS.CertFile }};
        ssl_certificate_key {{ .SecondaryTLS.KeyFile }};

        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        client_max_body_size 0;

        location / {
                set $upstream {{ .Atlas.URL }};
                proxy_pass $upstream$request_uri;
        }
}
{{- end }}

{{- if .Metrics.Enable }}
server {
        listen {{ .Metrics.HTTPPort }} default_server;
        {{- if .IPV6Enabled }}
        listen [::]:{{ .Metrics.HTTPPort }} default_server;
        {{- end }}

        location = /metrics {
                set $upstream http://127.0.0.1:8088;
                proxy_pass $upstream$request_uri;
        }
}

server {
        listen {{ .Metrics.HTTPSPort }} ssl default_server;

        {{- if .IPV6Enabled }}
        listen [::]:{{ .Metrics.HTTPSPort }} ssl default_server;
        {{- end }}

        ssl_certificate {{ .TLS.CertFile }};
        ssl_certificate_key {{ .TLS.KeyFile }};

        location = /metrics {
                set $upstream http://127.0.0.1:8088;
                proxy_pass $upstream$request_uri;
        }
}
{{- end }}

# ember app UI
server {
  listen 127.0.0.1:9080;
  server_name 127.0.0.1 localhost;

  root /app/frontend/atlas/dist;
  error_page 500 502 503 504 /50x.html;

  # All static assets such as pre-compiled JS/CSS files, fonts, etc.
  location ~* \.(?:css|js|eot|ttf|woff|woff2)$ {
    # This sets a caching TTL on the assets -- ensure that fingerprinting, versioning, or other cache busting
    # is used whenever the contents of the file changes to prevent users from being served stale content!
    expires 30d;

    add_header Access-Control-Allow-Origin '{{ .Hostname }}';

    if ($request_method = OPTIONS ) {
      add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
      add_header Access-Control-Max-Age '7200';
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 200;
    }
  }

  # Main entrypoint to the application, serving Ember's index.html page
  location / {
    # Disable caching for anything not fingerprinted.
    add_header Cache-Control no-cache;

    add_header X-Content-Type-Options 'nosniff';
    add_header X-Frame-Options 'SAMEORIGIN';
    add_header X-XSS-Protection '1; mode=block';
    add_header X-Download-Options 'noopen';
    add_header X-Permitted-Cross-Domain-Policies 'none';
    add_header Referrer-Policy 'strict-origin-when-cross-origin';

    try_files $uri /index.html?/$request_uri;
    index index.html /index.html;
  }
}